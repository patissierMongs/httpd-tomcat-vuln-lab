Define SRVROOT "/opt/httpd-2.4.66"
ServerRoot "${SRVROOT}"
Listen 8881
ServerName localhost
ServerAdmin admin@localhost

# ── 모듈 ──
LoadModule authn_file_module modules/mod_authn_file.so
LoadModule authn_core_module modules/mod_authn_core.so
LoadModule authz_host_module modules/mod_authz_host.so
LoadModule authz_groupfile_module modules/mod_authz_groupfile.so
LoadModule authz_user_module modules/mod_authz_user.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule access_compat_module modules/mod_access_compat.so
LoadModule auth_basic_module modules/mod_auth_basic.so
LoadModule reqtimeout_module modules/mod_reqtimeout.so
LoadModule filter_module modules/mod_filter.so
LoadModule mime_module modules/mod_mime.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule env_module modules/mod_env.so
LoadModule headers_module modules/mod_headers.so
LoadModule setenvif_module modules/mod_setenvif.so
LoadModule version_module modules/mod_version.so
LoadModule unixd_module modules/mod_unixd.so
LoadModule status_module modules/mod_status.so
LoadModule autoindex_module modules/mod_autoindex.so
LoadModule info_module modules/mod_info.so
LoadModule dir_module modules/mod_dir.so
LoadModule alias_module modules/mod_alias.so
LoadModule rewrite_module modules/mod_rewrite.so
LoadModule cgid_module modules/mod_cgid.so

# ── 기본 설정 ──
<IfModule unixd_module>
    User daemon
    Group daemon
</IfModule>

# [취약] 서버 버전 및 OS 정보 전부 노출
ServerTokens Full
ServerSignature On
TraceEnable On

# ── 로깅 ──
ErrorLog "logs/error_log"
LogLevel debug
LogFormat "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\"" combined
LogFormat "%h %l %u %t \"%r\" %>s %b" common
CustomLog "logs/access_log" combined

# ── MIME ──
TypesConfig conf/mime.types
AddType application/x-compress .Z
AddType application/x-gzip .gz .tgz
AddType text/html .shtml
AddOutputFilter INCLUDES .shtml

# ── 파일시스템 루트 ──
# [취약] 전체 파일시스템 접근 허용
<Directory />
    AllowOverride All
    Require all granted
    Options FollowSymLinks
</Directory>

# ── DocumentRoot ──
DocumentRoot "${SRVROOT}/htdocs"
<Directory "${SRVROOT}/htdocs">
    # [취약] 디렉터리 리스팅 + 심볼릭 링크 + CGI + SSI 전부 허용
    Options Indexes FollowSymLinks ExecCGI Includes
    AllowOverride All
    Require all granted
    DirectoryIndex index.html
</Directory>

# ── 에러 페이지 커스텀 ──
ErrorDocument 400 /error/400.html
ErrorDocument 401 /error/401.html
ErrorDocument 403 /error/403.html
ErrorDocument 404 /error/404.html
ErrorDocument 500 /error/500.html

# ── [취약] server-status 접근 제한 없음 ──
<Location /server-status>
    SetHandler server-status
    Require all granted
</Location>

# ── [취약] server-info 접근 제한 없음 ──
<Location /server-info>
    SetHandler server-info
    Require all granted
</Location>

# ── CGI ──
ScriptAlias /cgi-bin/ "${SRVROOT}/cgi-bin/"
<Directory "${SRVROOT}/cgi-bin">
    AllowOverride None
    Options ExecCGI
    Require all granted
    AddHandler cgi-script .cgi .pl .sh
</Directory>

# ── [취약] Alias로 서버 설정 디렉터리 노출 ──
Alias /conf ${SRVROOT}/conf
<Directory "${SRVROOT}/conf">
    Options Indexes
    Require all granted
</Directory>

# ── [취약] Alias로 로그 디렉터리 노출 ──
Alias /logs ${SRVROOT}/logs
<Directory "${SRVROOT}/logs">
    Options Indexes
    Require all granted
</Directory>

# ── .htaccess, .htpasswd 접근 허용 (연습용) ──
# 기본값은 deny지만 여기서는 의도적으로 허용
<Files ".ht*">
    Require all granted
</Files>

# ── AllowEncodedSlashes (인코딩된 슬래시 허용) ──
AllowEncodedSlashes On

# ── Tomcat 연동 (mod_jk) ──
Include conf/extra/httpd-jk.conf
