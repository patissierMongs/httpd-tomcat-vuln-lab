LoadModule jk_module modules/mod_jk.so

<IfModule jk_module>
	# 워커 설정 파일 위치 지정
	JkWorkersFile conf/workers.properties
	# 로그 파일 위치
	JkLogFile logs/mod_jk.log
	# 로그 레벨
	JkLogLevel info
	# 라우터(리라이터 따로 있음)
	JkMount /t1/* worker1
	JkMount /t2/* worker1
	JkMount /vuln/* worker1
	JkMount /manager/* worker1
	JkMount /host-manager/* worker1
	JkMount /examples/* worker1
	# 라우터 작성 예시
	#JkMount /*.do worker1
	#JkMount /*.jsp worker1
</IfModule>

# Load mod_jk module
