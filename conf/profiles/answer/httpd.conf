ServerRoot "/home/yuyu/httpd-2.4.66"
Listen 8881
ServerName localhost
ServerAdmin admin@localhost

# ── 모듈 ──
LoadModule authn_file_module modules/mod_authn_file.so
LoadModule authn_core_module modules/mod_authn_core.so
LoadModule authz_host_module modules/mod_authz_host.so
LoadModule authz_groupfile_module modules/mod_authz_groupfile.so
LoadModule authz_user_module modules/mod_authz_user.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule access_compat_module modules/mod_access_compat.so
LoadModule auth_basic_module modules/mod_auth_basic.so
LoadModule reqtimeout_module modules/mod_reqtimeout.so
LoadModule filter_module modules/mod_filter.so
LoadModule mime_module modules/mod_mime.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule env_module modules/mod_env.so
LoadModule headers_module modules/mod_headers.so
LoadModule setenvif_module modules/mod_setenvif.so
LoadModule version_module modules/mod_version.so
LoadModule unixd_module modules/mod_unixd.so
LoadModule status_module modules/mod_status.so
LoadModule autoindex_module modules/mod_autoindex.so
LoadModule info_module modules/mod_info.so
LoadModule dir_module modules/mod_dir.so
LoadModule alias_module modules/mod_alias.so
LoadModule rewrite_module modules/mod_rewrite.so
LoadModule cgid_module modules/mod_cgid.so

<IfModule unixd_module>
    User yuyu
    Group yuyu
</IfModule>

# ──────────────────────────────────────────────
# [VULN-02] 서버 버전 노출
# ──────────────────────────────────────────────
ServerTokens Full
ServerSignature On
# [FIX] ServerTokens Prod
# [FIX] ServerSignature Off
# → Prod로 바꾸면 "Server: Apache"만 출력.
# → Off로 바꾸면 에러 페이지에 서버 정보가 표시되지 않음.

# ──────────────────────────────────────────────
# [VULN-03] TRACE 메서드 활성화
# ──────────────────────────────────────────────
TraceEnable On
# [FIX] TraceEnable Off
# → Off로 바꾸면 TRACE 요청에 405 반환. XST 공격 차단.

# ── 로깅 ──
ErrorLog "logs/error_log"
LogLevel debug
# [FIX] LogLevel warn
# → debug는 민감 정보가 로그에 과다 기록됨. 운영에서는 warn 이상 권장.
LogFormat "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\"" combined
LogFormat "%h %l %u %t \"%r\" %>s %b" common
CustomLog "logs/access_log" combined

# ── MIME ──
TypesConfig conf/mime.types
AddType application/x-compress .Z
AddType application/x-gzip .gz .tgz
AddType text/html .shtml
AddOutputFilter INCLUDES .shtml

# ──────────────────────────────────────────────
# [VULN-04] 파일시스템 루트 접근 허용
# ──────────────────────────────────────────────
<Directory />
    AllowOverride All
    Require all granted
    Options FollowSymLinks
</Directory>
# [FIX] 아래처럼 변경:
# <Directory />
#     AllowOverride None
#     Require all denied
# </Directory>
# → 파일시스템 루트를 전부 차단하고, 필요한 디렉터리만 개별 허용.
# → AllowOverride None으로 .htaccess 무시.

# ──────────────────────────────────────────────
# [VULN-01] 디렉터리 리스팅
# [VULN-09] AllowOverride All
# [VULN-10] FollowSymLinks
# ──────────────────────────────────────────────
DocumentRoot "/home/yuyu/httpd-2.4.66/htdocs"
<Directory "/home/yuyu/httpd-2.4.66/htdocs">
    Options Indexes FollowSymLinks ExecCGI Includes
    AllowOverride All
    Require all granted
    DirectoryIndex index.html
</Directory>
# [FIX] 아래처럼 변경:
# <Directory "/home/yuyu/httpd-2.4.66/htdocs">
#     Options None
#     AllowOverride None
#     Require all granted
#     DirectoryIndex index.html
# </Directory>
# → Options None: 디렉터리 리스팅(Indexes), 심볼릭 링크(FollowSymLinks),
#   CGI 실행(ExecCGI), SSI(Includes) 모두 비활성화.
# → AllowOverride None: .htaccess로 설정 덮어쓰기 차단.

# ── 에러 페이지 커스텀 ──
ErrorDocument 400 /error/400.html
ErrorDocument 401 /error/401.html
ErrorDocument 403 /error/403.html
ErrorDocument 404 /error/404.html
ErrorDocument 500 /error/500.html
# 커스텀 에러 페이지 자체는 취약점이 아님.
# 단, 기본 에러 페이지는 서버 정보를 노출하므로 커스텀 권장.

# ──────────────────────────────────────────────
# [VULN-05] server-status 무제한 노출
# ──────────────────────────────────────────────
<Location /server-status>
    SetHandler server-status
    Require all granted
</Location>
# [FIX] 아래처럼 변경하거나 블록 전체 삭제:
# <Location /server-status>
#     SetHandler server-status
#     Require ip 127.0.0.1 ::1
# </Location>
# → 로컬에서만 접근 허용. 또는 mod_status 자체를 로드하지 않으면 완전 차단.
# → 운영에서 필요하면 VPN/내부망 IP만 허용.

# ──────────────────────────────────────────────
# [VULN-05] server-info 무제한 노출
# ──────────────────────────────────────────────
<Location /server-info>
    SetHandler server-info
    Require all granted
</Location>
# [FIX] 블록 전체 삭제 또는:
# <Location /server-info>
#     SetHandler server-info
#     Require ip 127.0.0.1 ::1
# </Location>
# → server-info는 모듈/설정을 전부 보여주므로 운영에서는 비활성화 권장.

# ──────────────────────────────────────────────
# [VULN-06] CGI Command Injection
# ──────────────────────────────────────────────
ScriptAlias /cgi-bin/ "/home/yuyu/httpd-2.4.66/cgi-bin/"
<Directory "/home/yuyu/httpd-2.4.66/cgi-bin">
    AllowOverride None
    Options ExecCGI
    Require all granted
    AddHandler cgi-script .cgi .pl .sh
</Directory>
# [FIX] CGI가 불필요하면 ScriptAlias 블록 전체 삭제 + cgid_module 미로드.
# 필요한 경우에도 cmd.sh 같은 명령 실행 스크립트는 반드시 제거하고,
# 사용자 입력을 eval/exec에 직접 전달하지 않도록 코드 검수 필수.
# → LoadModule cgid_module 줄 주석 처리
# → ScriptAlias ~ </Directory> 블록 전체 삭제

# ──────────────────────────────────────────────
# [VULN-07] 설정파일 디렉터리 Alias 노출
# ──────────────────────────────────────────────
Alias /conf /home/yuyu/httpd-2.4.66/conf
<Directory "/home/yuyu/httpd-2.4.66/conf">
    Options Indexes
    Require all granted
</Directory>
# [FIX] 이 Alias 블록 전체 삭제.
# → 설정파일은 절대 웹으로 노출하면 안 됨.

# ──────────────────────────────────────────────
# [VULN-07] 로그 디렉터리 Alias 노출
# ──────────────────────────────────────────────
Alias /logs /home/yuyu/httpd-2.4.66/logs
<Directory "/home/yuyu/httpd-2.4.66/logs">
    Options Indexes
    Require all granted
</Directory>
# [FIX] 이 Alias 블록 전체 삭제.
# → 로그에는 다른 사용자의 요청 정보(세션, IP)가 포함됨.

# ──────────────────────────────────────────────
# [VULN-08] .htaccess / .htpasswd 접근 허용
# ──────────────────────────────────────────────
<Files ".ht*">
    Require all granted
</Files>
# [FIX] 아래처럼 변경:
# <Files ".ht*">
#     Require all denied
# </Files>
# → .htaccess, .htpasswd 등 숨김 설정파일의 웹 접근 차단.

# ──────────────────────────────────────────────
# [VULN-11] 인코딩된 슬래시 허용
# ──────────────────────────────────────────────
AllowEncodedSlashes On
# [FIX] AllowEncodedSlashes Off
# → %2F가 포함된 요청을 404로 거부하여 경로 조작 우회를 차단.

# ── Tomcat 연동 (mod_jk) ──
Include conf/extra/httpd-jk.conf
